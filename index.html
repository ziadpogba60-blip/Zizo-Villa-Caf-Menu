<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الفيلا وزيزو كبدة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a100a;--card:#22160d;--ink:#f6ead2;--mute:#b8a583;--acc:#dcb560;--line:rgba(220,181,96,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:auto}
body[data-v=zizo]{--bg:#240c0a;--card:#341210;--ink:#fff1dc;--mute:#d3a995;--acc:#f4a62a;--line:rgba(244,166,42,.35)}
*{box-sizing:border-box}
body{-webkit-font-smoothing:antialiased;line-height:1.6;margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;transition:background .5s,color .5s;min-height:100vh}
.door{display:flex;gap:10px;justify-content:center;padding:14px 14px 0}
.door button{flex:1;max-width:220px;font:700 20px Amiri,'Traditional Arabic',serif;color:var(--mute);background:none;border:1.5px solid var(--line);border-radius:40px;padding:11px 8px;cursor:pointer}
.door button[aria-pressed=true]{background:var(--acc);color:#1a100a;border-color:var(--acc)}
.door button:focus-visible,.tabs button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
header{text-align:center;padding:34px 20px 22px}
.logo{width:150px;height:150px;border-radius:50%;border:2px solid var(--ink);object-fit:cover;display:block;margin:0 auto 18px}
.zl{width:150px;height:150px;border-radius:50%;border:2px solid var(--ink);margin:0 auto 18px;display:none;place-items:center;font:700 54px Amiri,'Traditional Arabic',serif;color:var(--acc);background:var(--card);line-height:1;object-fit:cover}
body[data-v=zizo] .logo{display:none}body[data-v=zizo] .zl{display:grid}
h1{letter-spacing:0;font:700 clamp(44px,11vw,70px)/1.2 Amiri,'Traditional Arabic',serif;margin:0;color:var(--ink)}
.sub{color:var(--mute);margin:10px 0 0;font-size:17px}
.dm{width:11px;height:11px;background:var(--acc);transform:rotate(45deg);margin:16px auto 0}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:9px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font:600 17px 'IBM Plex Sans Arabic',Tahoma,sans-serif;color:var(--ink);background:none;border:1.5px solid var(--ink);border-radius:30px;padding:9px 20px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);color:#1a100a;border-color:var(--acc);font-weight:700}
main{max-width:720px;margin:0 auto;padding:22px 16px 40px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.hd h2{font:700 36px Amiri,'Traditional Arabic',serif;margin:0}.hd span{color:var(--mute);font-size:15px}
.it{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:15px 20px;margin-bottom:11px}
.it b{font-weight:600;font-size:19px;display:block}.it small{color:var(--ink);opacity:.8;font-size:15px;line-height:1.7;display:block;margin-top:3px}
.pr{color:var(--acc);font:700 22px 'IBM Plex Sans Arabic',Tahoma,sans-serif;white-space:nowrap}.pr em{font-style:normal;margin-inline-start:12px}.pr em:first-of-type{margin-inline-start:0}.pr i{font:400 13px 'IBM Plex Sans Arabic';color:var(--mute);font-style:normal;margin-inline-end:5px}
.soon{border:1.5px dashed var(--line);border-radius:24px;padding:40px 22px;text-align:center;color:var(--mute);line-height:1.9}
.soon h3{font:700 26px Amiri,'Traditional Arabic',serif;color:var(--ink);margin:0 0 8px}
footer a{color:var(--acc);text-decoration:none;display:inline-block;margin:4px 8px;direction:ltr}footer{text-align:center;color:var(--acc);padding:10px 16px 40px;font-weight:700}footer p{color:var(--mute);font-weight:400;margin:8px 0 0}
.it,.hd{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(prefers-color-scheme:dark){:root{color-scheme:dark}}
</style></head><body data-v="villa">
